name = "ogref-r2"
main = "src/index.js"
compatibility_date = "2024-11-01"

# ===== 公開してよい変数（コミット可） =====
[vars]
# Firebase プロジェクトID（IDトークン検証の issuer/audience に使用）
PROJECT_ID = "animref-ef532"
# R2 バケット名（dev 用）※小文字英数字とハイフンのみ・3〜63文字（アンダースコア不可）
R2_BUCKET = "ogref-projects"
# R2 の Account ID（S3エンドポイントのホストに使用。署名URLにも現れるため秘密ではない）
R2_ACCOUNT_ID = "5006e4f3903e5857dd54aa6cda9aa183"
# CORS 許可オリジン（カンマ区切り）。dev配信元とローカル検証用。
ALLOWED_ORIGINS = "https://ogshaw03.github.io,http://localhost:5500,http://127.0.0.1:5500"
# 1ファイルの最大アップロードサイズ（MB）
MAX_UPLOAD_MB = "500"
# 署名URLの有効秒数
# UPLOAD: アップロードは短時間で完了するため10分。
# VIEW: 短いほど漏洩に強いが、動画の再生/シーク中もURLを使うため短すぎると再生が切れる。
#       30分をバランス点に（クライアントは失効時に /sign-view を取り直す想定）。
UPLOAD_URL_TTL = "600"
VIEW_URL_TTL = "1800"

# ===== 秘密（コミットしない。`wrangler secret put <NAME>` で登録） =====
# R2_ACCESS_KEY_ID      … R2 の S3 API トークンの Access Key ID
# R2_SECRET_ACCESS_KEY  … 同 Secret Access Key
